# Softnexus: mantiene los sistemas de tareas al día con lo que se une a la rama principal
# (PR unidos, validaciones del líder). Corre SOLO al unir: el código de una rama sin aprobar (con su
# copia del motor, a veces vieja) nunca escribe en Altum con la clave de la empresa.
# El "en revisión" al abrir el PR lo manda el computador de quien lo abre.
# Secretos: agrégalos en Settings > Secrets and variables > Actions con los mismos nombres de .sn/connectors.json.
name: sn-sync
on:
  push:
    branches: [main, master]

concurrency:
  group: sn-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: hashFiles('.sn/connectors.json') != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar (foto completa, idempotente)
        # Sin la clave de Altum de la empresa en los secretos, no falla: avisa (la configura el líder).
        run: |
          if [ -z "${SN_ALTUM_KEY}" ]; then echo "::notice::Falta la clave de Altum de la empresa en los secretos (la configura el líder). Mientras tanto la tarea se cierra con el siguiente git pull del equipo."; exit 0; fi
          node scripts/sn/sn-sync.mjs sync --upsert-only
        env:
          GH_TOKEN: ${{ github.token }}
          SN_ALTUM_KEY: ${{ secrets.SN_ALTUM_KEY }}
          SN_WEBHOOK_SECRET: ${{ secrets.SN_WEBHOOK_SECRET }}
          SN_MATRIX_TOKEN: ${{ secrets.SN_MATRIX_TOKEN }}
