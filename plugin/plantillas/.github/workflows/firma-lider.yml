# Softnexus: un PR solo se puede unir si lo aprobó el líder técnico que dice Altum.
# Las aprobaciones de cualquier otra persona no cuentan. Para que bloquee de verdad, esta verificación
# ("Firma del líder") tiene que ser obligatoria en la rama principal: `node scripts/sn/sn-sync.mjs proteger-rama`.
name: firma-lider
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

jobs:
  firma:
    name: Firma del líder
    if: hashFiles('.sn/connectors.json') != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ¿Lo aprobó el líder según Altum?
        # Sin la clave de Altum de la empresa no se puede saber quién es el líder: avisa sin fallar.
        # (El líder configura la clave y la protección de la rama al mismo tiempo: /sn-connect.)
        run: |
          if [ -z "${SN_ALTUM_KEY}" ]; then echo "::notice::Falta la clave de Altum de la empresa en los secretos: todavía no se puede verificar la firma del líder (lo configura el líder)."; exit 0; fi
          node scripts/sn/sn-sync.mjs verificar-firma ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          SN_ALTUM_KEY: ${{ secrets.SN_ALTUM_KEY }}
